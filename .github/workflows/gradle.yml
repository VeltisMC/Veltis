name: VeltisMC CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build VeltisMC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 26 (build toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle

      - name: Build and Test (JDK 26)
        run: ./gradlew build --stacktrace --no-daemon

      - name: Build VeltisMC (JDK 26)
        run: ./gradlew buildVeltisMC --stacktrace --no-daemon

      - name: Package distributable
        run: cp build/distributions/veltismc.jar veltismc.jar

      - name: Upload distributable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: veltismc-jdk26
          path: veltismc.jar