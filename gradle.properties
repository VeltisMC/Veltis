org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
# org.gradle.configuration-cache=true
org.gradle.welcome=never
kotlin.code.style=official

# ---------------------------------------------------------------------------
# VeltisMC build settings
# ---------------------------------------------------------------------------

# The Minecraft version to build against. Resolved from Mojang's official
# version manifest and SHA-1 verified; no URL is hardcoded anywhere. Change it
# here and re-run ./gradlew clean build. Note that patches are authored against a
# specific decompile, so a version bump usually means the patch set needs
# updating (./gradlew applyVeltisPatches will tell you exactly which hunks moved).
minecraftVersion=26.3

# Release channel for the build. Governs the GitHub release name
# (`Veltis <MinecraftVersion> <Channel> <sha>.jar`), the generated build metadata,
# and the CI publication target. The local distributable is always veltis.jar,
# whatever the channel. Supported values: stable, beta, nightly. This is the one
# place the channel comes from -- it is never inferred from a branch or a commit
# -- and `-Pchannel=...` overrides it for a single run (the workflow's
# workflow_dispatch input does exactly that).
channel=nightly

# How many target files the patcher applies in parallel. One thread per target,
# so a patch set with fewer targets than this simply uses fewer threads. Clamped
# to at least 1. The value is a build setting rather than a machine-derived one
# so a build behaves identically everywhere.
patchWorkers=4
