name: VeltisMC CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build VeltisMC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 26 (build toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle

      - name: Build and Test (JDK 26)
        run: ./gradlew build --stacktrace --no-daemon

      - name: Build VeltisMC (JDK 26)
        run: ./gradlew buildVeltisMC --stacktrace --no-daemon

      - name: Package distributable
        run: cp build/distributions/veltismc.jar veltismc.jar

      - name: Upload distributable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: veltismc-jdk26
          path: veltismc.jar

  build-java25:
    name: Build and test (Java 25)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Test on JDK 25
        run: ./gradlew test --stacktrace --no-daemon

      - name: Package on JDK 25
        run: ./gradlew buildVeltisMC --stacktrace --no-daemon

      - name: Upload distributable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: veltismc-jdk25
          path: build/distributions/veltismc.jar
