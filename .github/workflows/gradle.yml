name: VeltisMC CI

# The build is the release. `buildVeltisMC` writes one file,
# `build/distributions/veltis.jar`, plus the JSON that describes it. This
# workflow:
#
#   1. builds and tests the exact checked-out commit;
#   2. validates the metadata against the file the build actually wrote;
#   3. stages the distribution under the name a GitHub release stores it as;
#   4. publishes that as the build's durable GitHub Release asset; and
#   5. notifies the website so its download page shows the same build.
#
# A release asset cannot keep its spaces: GitHub normalizes the file name it is
# given (`Veltis 26.3 pre-alpha aaa8824.jar` becomes
# `Veltis.26.3.pre-alpha.aaa8824.jar`). The metadata carries both the human name
# and the stored one, and the upload is verified against the release's own
# asset list rather than against a name a release can never hold.
#
# The channel is never inferred from the commit or the branch. It comes from the
# repository default (gradle.properties, currently pre-alpha) or from the
# dispatch input below.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel (pre-alpha, alpha, beta, release); empty uses the repository default"
        required: false
        default: ""
        type: string

# One release pipeline per ref at a time. A second push waits rather than racing
# the first to create or overwrite the release metadata.
concurrency:
  group: veltis-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.metadata.outputs.channel }}
      minecraftVersion: ${{ steps.metadata.outputs.minecraftVersion }}
      commit: ${{ steps.metadata.outputs.commit }}
      shortCommit: ${{ steps.metadata.outputs.shortCommit }}
      artifact: ${{ steps.metadata.outputs.artifact }}
      assetName: ${{ steps.metadata.outputs.assetName }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 26 (build toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle

      - name: Build and test
        run: ./gradlew build --stacktrace --no-daemon

      - name: Build the API module
        # `api` ships nothing yet, so it is named here rather than left to
        # the aggregate `build`: the module is a CI gate in its own right, and a
        # future change that narrows what CI builds must not drop it silently.
        run: ./gradlew :api:build --stacktrace --no-daemon

      - name: Build VeltisMC
        env:
          # Empty for a push or a pull request, so the repository's own default
          # applies; set by hand for a workflow_dispatch release.
          CHANNEL: ${{ github.event.inputs.channel }}
        run: |
          set -euo pipefail
          if [ -n "$CHANNEL" ]; then
            ./gradlew buildVeltisMC --stacktrace --no-daemon -Pchannel="$CHANNEL"
          else
            ./gradlew buildVeltisMC --stacktrace --no-daemon
          fi

      - name: Validate build metadata against the distribution
        id: metadata
        run: |
          set -euo pipefail
          META=build/metadata/build-metadata.json
          JAR=build/distributions/veltis.jar

          test -f "$META" || { echo "::error::missing $META"; exit 1; }
          jq empty "$META" || { echo "::error::$META is not valid JSON"; exit 1; }

          # Every invariant the release name and the website depend on, checked
          # here so a malformed metadata file can never reach the release step.
          jq -e '
            (.channel | IN("pre-alpha", "alpha", "beta", "release"))
            and (.commit | test("^[0-9a-f]{40}$"))
            and (.shortCommit | test("^[0-9a-f]{7}$"))
            and (.shortCommit == (.commit[0:7]))
            and (.minecraftVersion | length > 0)
            and (.version | length > 0)
            and (.distributionArtifact == "veltis.jar")
            and (.artifact == ("Veltis " + .minecraftVersion + " " + .channel + " " + .shortCommit + ".jar"))
            and (.assetName | length > 0)
            and (.assetName | test("^[A-Za-z0-9_+@.-]+$"))
            and (.assetName == (.artifact | gsub("[^A-Za-z0-9_+@-]+"; ".") | gsub("\\.{2,}"; ".") | sub("^\\.+"; "") | sub("\\.+$"; "")))
          ' "$META" > /dev/null || {
            echo "::error::$META does not describe a valid Veltis release"
            cat "$META"
            exit 1
          }

          test -s "$JAR" || { echo "::error::the build did not produce a non-empty $JAR"; exit 1; }

          ARTIFACT=$(jq -r .artifact "$META")
          # The name GitHub stores the asset under: dots where the human name
          # has spaces. The upload verifies against this, never against the
          # spaced title, because a release cannot hold the spaced form.
          ASSET=$(jq -r .assetName "$META")
          {
            echo "channel=$(jq -r .channel "$META")"
            echo "minecraftVersion=$(jq -r .minecraftVersion "$META")"
            echo "commit=$(jq -r .commit "$META")"
            echo "shortCommit=$(jq -r .shortCommit "$META")"
            echo "artifact=$ARTIFACT"
            echo "assetName=$ASSET"
          } >> "$GITHUB_OUTPUT"

          # Stage the file under the name the release asset will carry, not the
          # spaced title: the same string the metadata names and the upload
          # checks for.
          mkdir -p build/release
          cp "$JAR" "build/release/$ASSET"
          ls -l build/release
          echo "Publishing $ARTIFACT as $ASSET ($(jq -r .channel "$META"), $(jq -r .commit "$META"))"

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          # The artifact is named after the human release name; it carries the
          # one file the build packaged, staged under the name GitHub stores the
          # release asset as (${{ steps.metadata.outputs.assetName }}).
          name: ${{ steps.metadata.outputs.artifact }}
          path: build/release/${{ steps.metadata.outputs.assetName }}
          if-no-files-found: error

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: veltis-metadata-${{ steps.metadata.outputs.channel }}-${{ steps.metadata.outputs.shortCommit }}
          path: build/metadata/build-metadata.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Native engine, executed on every Tier 1 runner this repository can use.
  #
  # Compiling a library is not evidence that it works: each native-host entry
  # below builds the library, runs the C/C++ suite (including the export and
  # binary-format check), runs the Java FFM integration suite against the real
  # library, runs the Java-only fallback suite, and starts/stops the server once
  # with the library and once without it. A platform enters the README support
  # table only after its entry here has run green.
  # ---------------------------------------------------------------------------
  native-host:
    name: Native host (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86-64 MSVC
            os: windows-latest
            platform: windows-x86_64
            toolchain: msvc
            generator: ""
            cc: ""
            cxx: ""
            osxArch: ""
            # A DLL copied beside a JAR must not need a compiler runtime; MSVC's
            # own default (/MD) would import vcruntime140.dll.
            staticRuntime: "true"
          - name: Windows x86-64 clang-cl
            os: windows-latest
            platform: windows-x86_64
            toolchain: clang-cl
            generator: Ninja
            cc: clang-cl
            cxx: clang-cl
            osxArch: ""
            staticRuntime: "true"
          - name: Windows x86-64 LLVM-MinGW
            os: windows-latest
            platform: windows-x86_64
            toolchain: llvm-mingw
            generator: Ninja
            cc: clang
            cxx: clang++
            osxArch: ""
            # Left empty on purpose: a Windows build is already static by the
            # CMake default, and this lane proves the default rather than a flag.
            staticRuntime: ""
          - name: Windows ARM64 MSVC
            # `windows-11-arm` is a generally available hosted label. There is no
            # continue-on-error here: an ARM64 Windows regression must fail CI.
            os: windows-11-arm
            platform: windows-aarch64
            toolchain: msvc
            generator: ""
            cc: ""
            cxx: ""
            osxArch: ""
            staticRuntime: "true"
            # No vendor ships a Windows ARM64 JDK 26 (or 25) for Temurin — the
            # Adoptium API returns zero windows/aarch64 builds for both — so the
            # default distribution fails at setup time before any build runs.
            # Zulu does ship win-aarch64 25.0.5.0.3, matching the locally
            # verified toolchain; Java 25 still provides the FFM API (22+).
            javaDistribution: zulu
            javaVersion: "25"
          - name: Linux x86-64 GCC
            os: ubuntu-latest
            platform: linux-x86_64
            toolchain: gcc
            generator: Ninja
            cc: gcc
            cxx: g++
            osxArch: ""
          - name: Linux x86-64 Clang
            os: ubuntu-latest
            platform: linux-x86_64
            toolchain: clang
            generator: Ninja
            cc: clang
            cxx: clang++
            osxArch: ""
          - name: Linux AArch64 GCC
            os: ubuntu-24.04-arm
            platform: linux-aarch64
            toolchain: gcc
            generator: Ninja
            cc: gcc
            cxx: g++
            osxArch: ""
          - name: macOS Apple Silicon
            # All macOS 14 images were retired from GitHub-hosted Actions on
            # 2026-11-02, so `macos-14` no longer schedules. `macos-15` is the
            # GA arm64 label; `macos-26`/`macos-latest` would silently move the
            # lane to a newer OS than the deployment target claims to cover.
            os: macos-15
            platform: macos-aarch64
            toolchain: apple-clang
            generator: Ninja
            cc: ""
            cxx: ""
            osxArch: arm64
          - name: macOS Intel x86-64
            os: macos-15-intel
            platform: macos-x86_64
            toolchain: apple-clang
            generator: Ninja
            cc: ""
            cxx: ""
            osxArch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.javaVersion || '26' }} (build toolchain)
        uses: actions/setup-java@v4
        with:
          # Overridable per matrix entry: no vendor ships a Windows ARM64 JDK
          # 26 or 25 for Temurin (the Adoptium API returns zero win-aarch64
          # builds for both), so the default distribution fails at setup time
          # before any build runs. Zulu does ship win-aarch64 25.0.5.0.3 —
          # matching the locally verified toolchain — and Java 25 still has the
          # FFM API (22+). Every other lane keeps the Temurin 26 default.
          distribution: ${{ matrix.javaDistribution || 'temurin' }}
          java-version: ${{ matrix.javaVersion || '26' }}
          cache: gradle

      # The build JDK is a Gradle project property (`veltisToolchainVersion`,
      # default 26), so a lane that installed a different JDK must build with
      # the one it actually has — win-aarch64 has no JDK 26 to fall back to and
      # Gradle does not auto-download toolchains. ORG_GRADLE_PROJECT_* is
      # Gradle's documented environment-variable form of -P, so one line keeps
      # every Gradle invocation in this job on the installed JDK.
      - name: Match the Gradle toolchain to the installed JDK
        if: matrix.javaVersion
        shell: bash
        run: echo "ORG_GRADLE_PROJECT_veltisToolchainVersion=${{ matrix.javaVersion }}" >> "$GITHUB_ENV"

      - name: Prepare the MSVC environment for clang-cl
        if: matrix.toolchain == 'clang-cl'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Add LLVM clang-cl to PATH
        if: matrix.toolchain == 'clang-cl'
        shell: pwsh
        run: '"C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append'

      - name: Ensure Ninja (Windows)
        if: runner.os == 'Windows' && matrix.generator == 'Ninja'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }

      - name: Install LLVM-MinGW (x86-64 UCRT)
        if: matrix.toolchain == 'llvm-mingw'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Invoke-RestMethod -Headers @{ 'User-Agent' = 'veltis-ci' } `
            -Uri 'https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest'
          $asset = $release.assets |
            Where-Object { $_.name -match '^llvm-mingw-.*-ucrt-x86_64\.zip$' } |
            Select-Object -First 1
          if (-not $asset) { throw 'no LLVM-MinGW x86_64 UCRT asset in the latest release' }
          $zip = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          $root = Get-ChildItem $env:RUNNER_TEMP -Directory -Filter 'llvm-mingw-*' |
            Select-Object -First 1
          (Join-Path $root.FullName 'bin') | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install native toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build binutils file
          case "${{ matrix.toolchain }}" in
            gcc) sudo apt-get install -y --no-install-recommends gcc g++ ;;
            clang) sudo apt-get install -y --no-install-recommends clang ;;
          esac

      - name: Install native toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja

      - name: Select the compiler under test
        if: matrix.cc != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      - name: Build, test and package the native library
        shell: bash
        run: |
          set -euo pipefail
          args=("-PveltisNativePlatform=${{ matrix.platform }}")
          if [ -n "${{ matrix.generator }}" ]; then
            args+=("-PveltisNativeGenerator=${{ matrix.generator }}")
          fi
          if [ -n "${{ matrix.osxArch }}" ]; then
            args+=("-PveltisNativeOsxArchitectures=${{ matrix.osxArch }}")
          fi
          if [ -n "${{ matrix.staticRuntime }}" ]; then
            args+=("-PveltisNativeStaticRuntime=${{ matrix.staticRuntime }}")
          fi
          # One task that proves configure, build, CTest, the export check, the
          # Java FFM suite, packaging, manifest and checksums for this host.
          ./gradlew :veltis-native:verifyNativeRelease -PveltisNativeTest=true \
            "${args[@]}" --stacktrace --no-daemon

      - name: Verify the native library dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll = "native/build/native/dist/${{ matrix.platform }}/veltis_native.dll"
          if (-not (Test-Path $dll)) { throw "native library was not packaged: $dll" }
          $machine = if ("${{ matrix.platform }}" -like '*-aarch64') { 'aarch64' } else { 'x86_64' }
          # The import check follows the manifest, not the job label: an artifact
          # that claims a static runtime must really import no CRT, and one that
          # links it dynamically has to be recorded as the requirement it is.
          $manifest = "native/build/native/dist/${{ matrix.platform }}/veltis-native-manifest.json"
          if (-not (Test-Path $manifest)) { throw "no artifact manifest: $manifest" }
          $static = (Get-Content -Raw $manifest | ConvertFrom-Json).runtime.staticRuntime
          if ($null -eq $static) { throw "manifest has no runtime.staticRuntime field" }
          $checkArgs = @{ Path = $dll; ExpectMachine = $machine }
          if ($static -ne $true) { $checkArgs['AllowMsvcruntime'] = $true }
          ./native/tools/check-pe-imports.ps1 @checkArgs
          if ($static -ne $true) {
            "::notice::$($machine) DLL links the MSVC runtime dynamically; it needs that runtime installed" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Verify the native library dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          LIB="native/build/native/${{ matrix.platform }}/libveltis_native.so"
          test -f "$LIB" || { echo "::error::native library was not produced"; exit 1; }
          file "$LIB"
          NEEDED=$(readelf -d "$LIB" | awk '/\(NEEDED\)/ {print $5}' | tr -d '[]')
          printf 'NEEDED:\n'; printf '%s\n' "$NEEDED" | sed 's/^/  /'
          # ld-linux-* is glibc's own program interpreter — as system a library
          # as libc itself. It lands in NEEDED whenever an object uses dynamic
          # TLS, which this module does (the thread-local last-error slot), so
          # rejecting it would be a false positive on a core glibc component.
          UNEXPECTED=$(printf '%s\n' "$NEEDED" | grep -Ev \
            '^(libc|libm|libstdc\+\+|libgcc_s|libpthread|libdl|librt|ld-linux(-[A-Za-z0-9_-]+)?)\.so(\.[0-9]+)*$' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::unexpected shared-library dependency: $UNEXPECTED"
            exit 1
          fi
          # Java passes the resolved absolute path to the OS loader, so an
          # embedded RPATH could only ever be a build-machine path that the
          # shipped library would keep trying to consult for its dependencies.
          # Distribution relies on the caller's search, never on the binary.
          if readelf -d "$LIB" | grep -Eq '\((RPATH|RUNPATH)\)'; then
            echo "::error::native library embeds an RPATH/RUNPATH"
            readelf -d "$LIB"
            exit 1
          fi
          # Recorded, not asserted: the oldest glibc/libstdc++ symbols used.
          REQUIREMENTS=$(readelf --version-info "$LIB" |
            grep -oE '(GLIBC|GLIBCXX|CXXABI)_[0-9]+(\.[0-9]+)+' | sort -Vu)
          printf 'version requirements:\n'; printf '%s\n' "$REQUIREMENTS" | sed 's/^/  /'
          {
            echo "### Native runtime requirements (Linux ${{ matrix.platform }})"
            echo '```'
            printf '%s\n' "$REQUIREMENTS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the native library dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          LIB="native/build/native/${{ matrix.platform }}/libveltis_native.dylib"
          test -f "$LIB" || { echo "::error::native library was not produced"; exit 1; }
          file "$LIB"
          SLICES=$(lipo -archs "$LIB")
          if [ "${{ matrix.platform }}" = "macos-aarch64" ]; then EXPECTED=arm64; else EXPECTED=x86_64; fi
          echo "slices: $SLICES (expected $EXPECTED)"
          if [ "$SLICES" != "$EXPECTED" ]; then
            echo "::error::unexpected architecture slices (no universal binary is published)"
            exit 1
          fi
          DINSTALL_NAME=$(otool -D "$LIB" | sed -n '2p' | xargs)
          test -n "$INSTALL_NAME" || {
            echo "::error::could not read dylib install name"
            exit 1
          }
          DEPS=$(otool -L "$LIB" | tail -n +2 | awk '{print $1}' |
            grep -Fvx "$INSTALL_NAME" || true)
          UNEXPECTED=$(printf '%s\n' "$DEPS" | grep -Ev '^(/usr/lib/|/System/Library/)' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::unexpected dylib dependency: $UNEXPECTED"
            exit 1
          fi
          # The deployment target is a build-time claim; record it instead of
          # claiming support for an older macOS that was never executed.
          MINOS=$(vtool -show-build "$LIB" | awk '/minos/ {print $2; exit}')
          test -n "$MINOS" || { echo "::error::dylib has no LC_BUILD_VERSION minos"; exit 1; }
          echo "minimum macOS: $MINOS"
          # The manifest is what a downstream packager reads, so it must agree
          # with what the linker actually baked in.
          MANIFEST="native/build/native/dist/${{ matrix.platform }}/veltis-native-manifest.json"
          test -f "$MANIFEST" || { echo "::error::no artifact manifest: $MANIFEST"; exit 1; }
          CLAIMED=$(sed -n 's/.*"minimumOsVersion": "\([^"]*\)".*/\1/p' "$MANIFEST")
          if [ "$CLAIMED" != "$MINOS" ]; then
            echo "::error::manifest claims minimum macOS '$CLAIMED' but the binary declares minos $MINOS"
            exit 1
          fi
          echo "### Native runtime requirement (macOS ${{ matrix.platform }}): $MINOS" >> "$GITHUB_STEP_SUMMARY"

      - name: Java-only fallback suite (no native fixture)
        shell: bash
        run: |
          set -euo pipefail
          # The flag makes the Gradle fixture wiring detach every library path and
          # makes NativeLoaderTest assert that nothing leaked into the JVM.
          ./gradlew :veltis-native:cleanTest :veltis-native:test \
            "-Dveltis.native.test.expectJavaOnly=true" \
            --stacktrace --no-daemon

      - name: Native-enabled server startup and shutdown
        shell: bash
        run: |
          set -euo pipefail
          LIB=$(find native/build/native -maxdepth 2 -type f \
            \( -name 'veltis_native.dll' -o -name 'libveltis_native.so' -o -name 'libveltis_native.dylib' \) \
            | head -n 1)
          test -f "$LIB" || { echo "::error::native library was not produced"; exit 1; }
          ./gradlew -Dveltis.native.path="$LIB" \
            :server:cleanTest :server:test \
            --tests "org.veltismc.runtime.NativeBootstrapTest" \
            --stacktrace --no-daemon

      - name: Java-only server startup and shutdown
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew -Dveltis.native.path= \
            :server:cleanTest :server:test \
            --tests "org.veltismc.runtime.NativeBootstrapTest" \
            --stacktrace --no-daemon

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: veltis-native-${{ matrix.platform }}-${{ matrix.toolchain }}
          path: |
            native/build/native/dist/${{ matrix.platform }}
            native/build/native/dist/verification-report-${{ matrix.platform }}.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Cross-compilation. These jobs prove that the source and CMake configuration
  # compile for a target; they deliberately do not claim runtime support, because
  # the producing runner cannot execute the artifact. CTest is configured off in
  # every cross preset.
  # ---------------------------------------------------------------------------
  native-cross:
    name: Native cross-compile (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows ARM64 LLVM-MinGW
            os: windows-latest
            platform: windows-aarch64
            preset: windows-arm64-mingw-cross
            builddir: native/build/native/cmake/windows-arm64-mingw-cross
            artifact: native/build/native/windows-aarch64/veltis_native.dll
            toolchain: cmake/toolchains/windows-arm64-mingw.cmake
            optional: false
          - name: Linux AArch64 GNU
            os: ubuntu-latest
            platform: linux-aarch64
            preset: linux-aarch64-cross
            builddir: native/build/native/cmake/linux-aarch64-cross
            artifact: native/build/native/linux-aarch64/libveltis_native.so
            toolchain: cmake/toolchains/linux-aarch64.cmake
            optional: false
          - name: Linux RISC-V 64 GNU
            os: ubuntu-latest
            platform: linux-riscv64
            preset: linux-riscv64-cross
            builddir: native/build/native/cmake/linux-riscv64-cross
            artifact: native/build/native/linux-riscv64/libveltis_native.so
            toolchain: cmake/toolchains/linux-riscv64.cmake
            # Tier 2 investigation only. This is the one entry allowed to fail;
            # Windows ARM64 and Linux AArch64 must fail the workflow.
            optional: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 26 (cross-execution guard)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle

      - name: Install LLVM-MinGW (host x86-64 build)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # This job runs on an x86-64 host. The aarch64 distribution is a
          # native ARM64 toolchain and cannot be executed here; the x86-64
          # distribution contains the aarch64-w64-mingw32-* cross compilers.
          $release = Invoke-RestMethod -Headers @{ 'User-Agent' = 'veltis-ci' } `
            -Uri 'https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest'
          $asset = $release.assets |
            Where-Object { $_.name -match '^llvm-mingw-.*-ucrt-x86_64\.zip$' } |
            Select-Object -First 1
          if (-not $asset) { throw 'no LLVM-MinGW x86_64 UCRT asset in the latest release' }
          $zip = Join-Path $env:RUNNER_TEMP 'llvm-mingw-cross.zip'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          $root = Get-ChildItem $env:RUNNER_TEMP -Directory -Filter 'llvm-mingw-*' |
            Select-Object -First 1
          (Join-Path $root.FullName 'bin') | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install cross toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build binutils
          case "${{ matrix.preset }}" in
            linux-aarch64-cross)
              sudo apt-get install -y --no-install-recommends \
                gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
              ;;
            linux-riscv64-cross)
              sudo apt-get install -y --no-install-recommends \
                gcc-riscv64-linux-gnu g++-riscv64-linux-gnu
              ;;
          esac

      - name: Ensure Ninja (Windows cross-compile)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }

      - name: Configure and compile
        working-directory: native
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Verify format, machine, exports and dependencies
        shell: bash
        run: |
          set -euo pipefail
          ART="${{ matrix.artifact }}"
          test -f "$ART" || { echo "::error::cross-compiled artifact missing: $ART"; exit 1; }
          file "$ART" || true

          # The header is the single source of truth for the public ABI.
          EXPECTED=$(grep -E '^VELTIS_NATIVE_API ' native/include/veltis/native/veltis_native.h |
            sed -E 's/.*[ *]([A-Za-z_][A-Za-z0-9_]*)\(.*/\1/' | sort)
          EXPECTED_COUNT=$(printf '%s\n' "$EXPECTED" | wc -l | tr -d ' ')
          [ "$EXPECTED_COUNT" -eq 13 ] || {
            echo "::error::header declares $EXPECTED_COUNT exports, expected 13"
            exit 1
          }

          # CMake writes the identity fields beside the library. This runner
          # cannot execute the artifact, but it can still prove that what a
          # downstream packager would read describes the bytes it ships.
          INFO="$(dirname "$ART")/veltis-native-build-info.json"
          test -f "$INFO" || { echo "::error::no build metadata beside $ART"; exit 1; }
          json_string() { grep -o "\"$1\": \"[^\"]*\"" "$INFO" | head -n 1 | cut -d'"' -f4 || true; }
          json_number() { grep -o "\"$1\": [0-9]*" "$INFO" | head -n 1 | awk '{print $2}' || true; }
          PLATFORM="${{ matrix.platform }}"
          for pair in "os:${PLATFORM%%-*}" "architecture:${PLATFORM##*-}" "platform:$PLATFORM"; do
            key="${pair%%:*}"; want="${pair#*:}"
            got=$(json_string "$key")
            [ "$got" = "$want" ] || {
              echo "::error::$key is '$got' in $INFO but the build targeted '$want'"
              exit 1
            }
          done
          # 64-bit is a property of the Java descriptor, not a preference: size_t
          # is mapped to JAVA_LONG, so a 32-bit artifact would corrupt lengths.
          BITS=$(json_number pointerBits)
          [ "$BITS" = "64" ] || { echo "::error::manifest pointerBits is $BITS, expected 64"; exit 1; }
          ABI=$(json_number abiVersion)
          [ "$ABI" = "1" ] || { echo "::error::manifest abiVersion is $ABI, expected 1"; exit 1; }
          MANIFEST_EXPORTS=$(sed -n 's/.*"exports": \[\(.*\)\].*/\1/p' "$INFO" |
            tr -d ' "' | tr ',' '\n' | sort)
          diff -u <(printf '%s\n' "$EXPECTED") <(printf '%s\n' "$MANIFEST_EXPORTS") || {
            echo "::error::the manifest export list is not the public header's"
            exit 1
          }
          echo "manifest: os/arch/pointerBits/abi and 13 exports agree with the header"

          case "${{ matrix.platform }}" in
            windows-aarch64)
              MACHINE=$(llvm-objdump -f "$ART" | sed -n 's/^architecture: //p' | head -n 1)
              echo "machine: $MACHINE"
              [ "$MACHINE" = "aarch64" ] || { echo "::error::not an ARM64 image"; exit 1; }
              ACTUAL=$(llvm-readobj --coff-exports "$ART" | awk '/Name: / {print $2}' | sort)
              if llvm-readobj --coff-exports "$ART" | grep -Eq 'Name: (\?|_Z)'; then
                echo "::error::mangled C++ symbol in the export table"
                exit 1
              fi
              pwsh -NoProfile -File native/tools/check-pe-imports.ps1 \
                -Path "$ART" -ExpectMachine aarch64
              ;;
            linux-aarch64)
              readelf -h "$ART" | grep 'Machine:.*AArch64' >/dev/null
              ACTUAL=$(nm -D --defined-only --extern-only "$ART" |
                awk '$2 ~ /^[TW]$/ {print $3}' | grep -v '^_' | sort)
              ;;
            linux-riscv64)
              readelf -h "$ART" | grep -E 'Machine:.*(RISC-V|RISC-V 64)' >/dev/null
              ACTUAL=$(nm -D --defined-only --extern-only "$ART" |
                awk '$2 ~ /^[TW]$/ {print $3}' | grep -v '^_' | sort)
              ;;
            *)
              echo "::error::unknown platform ${{ matrix.platform }}"
              exit 1
              ;;
          esac

          diff -u <(printf '%s\n' "$EXPECTED") <(printf '%s\n' "$ACTUAL") || {
            echo "::error::exported symbols do not match the public header"
            exit 1
          }
          echo "exports: 13 (exact match, no C++ symbols)"

          if [ "${{ matrix.platform }}" = "windows-aarch64" ]; then
            echo "compile-only: the x86-64 runner cannot execute an ARM64 DLL"
          else
            NEEDED=$(readelf -d "$ART" | awk '/\(NEEDED\)/ {print $5}' | tr -d '[]')
            printf 'NEEDED:\n'; printf '%s\n' "$NEEDED" | sed 's/^/  /'
            # ld-linux-*: glibc's own program interpreter (as system a component
            # as libc), recorded as NEEDED whenever an object uses dynamic TLS —
            # which this module does via the thread-local last-error slot.
            UNEXPECTED=$(printf '%s\n' "$NEEDED" | grep -Ev \
              '^(libc|libm|libstdc\+\+|libgcc_s|libpthread|libdl|librt|ld-linux(-[A-Za-z0-9_-]+)?)\.so(\.[0-9]+)*$' || true)
            [ -z "$UNEXPECTED" ] || {
              echo "::error::unexpected shared-library dependency: $UNEXPECTED"
              exit 1
            }
            echo "compile-only: no target binary was executed"
          fi

      - name: Verify the cross build cannot execute target binaries
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "${{ matrix.builddir }}/CTestTestfile.cmake" ]; then
            echo "::error::cross build registered CTest tests"
            exit 1
          fi
          # The Gradle guard is the second half of the claim: even if a caller
          # forgets, testNative must refuse to run a foreign executable.
          set +e
          ./gradlew :veltis-native:testNative \
            "-PveltisNativePlatform=${{ matrix.platform }}" \
            "-PveltisNativeToolchainFile=${{ matrix.toolchain }}" \
            -PveltisNativeGenerator=Ninja --no-daemon --stacktrace > guard.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::cross build executed the target test binary"
            cat guard.log
            exit 1
          fi
          if ! grep -q 'cannot run a cross-compiled build' guard.log; then
            echo "::error::the guard failed for an unexpected reason"
            cat guard.log
            exit 1
          fi
          echo "guard rejected execution as expected"

      - name: Upload cross-compiled artifact (inspection only)
        uses: actions/upload-artifact@v4
        with:
          name: veltis-native-cross-${{ matrix.platform }}
          path: native/build/native/${{ matrix.platform }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Debug configuration. Release is the shipped artifact; Debug exists to catch
  # assertion-sensitive defects in the engine and its tests. The build type is
  # recorded in the packaged manifest, so these jobs never masquerade as release
  # builds.
  # ---------------------------------------------------------------------------
  native-debug:
    name: Native debug (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86-64 MSVC
            os: windows-latest
            platform: windows-x86_64
          - name: Linux x86-64 GCC
            os: ubuntu-latest
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 26 (build toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle

      - name: Install native toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build gcc g++

      - name: Build and test in Debug
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :veltis-native:check -PveltisNativeTest=true \
            "-PveltisNativePlatform=${{ matrix.platform }}" \
            "-PveltisNativeBuildType=Debug" \
            -PveltisNativeGenerator=Ninja --stacktrace --no-daemon

  # ---------------------------------------------------------------------------
  # Tier 2 investigation. FreeBSD is not a supported release platform; this job
  # exists to find portability defects and is explicitly non-blocking. It must
  # not be read as a support claim until the support table says so.
  # ---------------------------------------------------------------------------
  native-freebsd-investigation:
    name: Native engine (FreeBSD investigation, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and test inside a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y cmake ninja
          run: |
            set -eu
            cd native
            cmake -S . -B build/native/cmake/freebsd-x86_64 -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DVELTIS_NATIVE_OUTPUT_DIR="$PWD/build/native/freebsd-x86_64" \
              -DVELTIS_NATIVE_BUILD_TESTS=ON
            cmake --build build/native/cmake/freebsd-x86_64 --parallel
            ctest --test-dir build/native/cmake/freebsd-x86_64 --output-on-failure

  publish:
    name: Publish durable release & notify website
    needs: build
    # A pull request builds and verifies but never publishes: a failed build must
    # never leave behind metadata claiming the commit was released.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      # Least privilege: the only write this job needs is creating the release
      # and its asset. The website notification uses the secret below.
      contents: write
    steps:
      - name: Download the distribution under its release name
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: release

      - name: Download the build metadata
        uses: actions/download-artifact@v4
        with:
          name: veltis-metadata-${{ needs.build.outputs.channel }}-${{ needs.build.outputs.shortCommit }}
          path: metadata

      - name: Publish GitHub Release asset
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          # The publish job does not check out the repository, so `gh` is told
          # explicitly which repository to act on rather than inferring it from
          # a git remote that is not there.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          META=metadata/build-metadata.json
          # `ARTIFACT` is the human release title; `ASSET` is the name the
          # release actually stores. They differ only in the spaces GitHub
          # turns into dots, and only `ASSET` can be verified against a release.
          ARTIFACT=$(jq -r .artifact "$META")
          ASSET=$(jq -r .assetName "$META")
          CHANNEL=$(jq -r .channel "$META")
          MC=$(jq -r .minecraftVersion "$META")
          SHORT=$(jq -r .shortCommit "$META")
          TAG="veltis-$CHANNEL-$MC-$SHORT"
          FILE="release/$ASSET"

          test -s "$FILE" || {
            echo "::error::the staged release asset is missing or empty"
            echo "  expected: $FILE"
            echo "  found under release/:"
            ls -R release || true
            exit 1
          }

          # One release per build, so the channel keeps a real history and the
          # asset URL is durable (Actions artifacts expire; releases do not).
          # The official release line (canonical `release`) is a full release;
          # every other channel is marked prerelease so the website can tell them
          # apart even if it only reads the releases API.
          PRERELEASE_FLAG=""
          if [ "$CHANNEL" != "release" ]; then PRERELEASE_FLAG="--prerelease"; fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$ARTIFACT" \
              $PRERELEASE_FLAG
          else
            gh release create "$TAG" \
              --title "$ARTIFACT" \
              --notes "Automated VeltisMC ${CHANNEL} build for Minecraft ${MC} at ${SHORT}." \
              $PRERELEASE_FLAG
          fi

          # --clobber deletes an asset of the staged name before uploading, so a
          # re-run replaces the asset instead of failing on a duplicate. The
          # staged name is the one GitHub stores, so the delete matches.
          gh release upload "$TAG" "$FILE" --clobber

          # An upload is not proof of an asset. Ask the release what it holds
          # and compare exactly, so a normalization surprise or a failed upload
          # stops the run here instead of being reported as a publication.
          #
          # Read the release from the REST API, not `gh release view --json`:
          # that export renames the asset's REST `browser_download_url` to
          # `url`, so the real field name only exists on the API response.
          RELEASE=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG")
          ACTUAL=$(printf '%s' "$RELEASE" | jq -r '.assets[].name')
          if ! printf '%s\n' "$ACTUAL" | grep -Fxq "$ASSET"; then
            echo "::error::release $TAG has no asset named '$ASSET' (the GitHub-stored form of '$ARTIFACT')."
            echo "::error::assets the release actually holds:"
            if [ -n "$ACTUAL" ]; then printf '%s\n' "$ACTUAL" | sed 's/^/    /'; else echo "    (none)"; fi
            echo "::error::staged release directory:"
            ls -lR release || true
            exit 1
          fi

          # The URL is read from the release, never constructed. The name is
          # passed as a jq argument rather than interpolated into the program.
          ASSET_URL=$(printf '%s' "$RELEASE" | jq -r --arg n "$ASSET" \
            '.assets[] | select(.name == $n) | .browser_download_url' | head -n 1)
          test -n "$ASSET_URL" || {
            echo "::error::release $TAG lists '$ASSET' but the API returned no browser_download_url"
            printf '%s\n' "$RELEASE"
            exit 1
          }

          {
            echo "tag=$TAG"
            echo "assetUrl=$ASSET_URL"
            echo "releaseUrl=https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Published $ASSET_URL"

      - name: Check website dispatch configuration
        id: dispatch-config
        env:
          TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          REPOSITORY: ${{ vars.WEBSITE_REPOSITORY }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::WEBSITE_DISPATCH_TOKEN is not configured; skipping website dispatch."
          elif [ -z "$REPOSITORY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::WEBSITE_REPOSITORY is not configured; skipping website dispatch."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify the website
        if: steps.dispatch-config.outputs.enabled == 'true'
        env:
          TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          REPOSITORY: ${{ vars.WEBSITE_REPOSITORY }}
          ASSET_URL: ${{ steps.release.outputs.assetUrl }}
          RELEASE_URL: ${{ steps.release.outputs.releaseUrl }}
        run: |
          set -euo pipefail
          SIZE=$(stat -c%s "release/$(jq -r .assetName metadata/build-metadata.json)")
          PUBLISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # `client_payload` allows at most 10 top-level properties, and the
          # build metadata alone plus the durable location already exceeds that.
          # The two groups are nested instead of flattened: the website validates
          # both and stores the flat shape it reads. Nesting also leaves room for
          # a future metadata field without tripping the same limit again.
          payload=$(jq -c \
            --arg url "$ASSET_URL" \
            --arg releaseUrl "$RELEASE_URL" \
            --arg publishedAt "$PUBLISHED_AT" \
            --argjson size "$SIZE" \
            '{event_type: "veltis-release",
              client_payload: {
                metadata: .,
                release: {downloadUrl: $url, releaseUrl: $releaseUrl,
                          publishedAt: $publishedAt, size: $size}
              }}' \
            metadata/build-metadata.json)

          status=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/dispatches" \
            -d "$payload")
          if [ "$status" != "204" ]; then
            echo "::error::repository dispatch to $REPOSITORY failed with HTTP $status"
            cat /tmp/dispatch.out
            exit 1
          fi
          echo "Notified $REPOSITORY about $ASSET_URL"
